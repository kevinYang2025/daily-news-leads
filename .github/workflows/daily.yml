name: Daily News Leads

on:
  schedule:
    # 每天北京时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-leads
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NEWS_TZ: Asia/Shanghai
          NEWS_RUN_HOUR: '10'
          NEWS_WINDOW_HOURS: '24'
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.js outputs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news leads $(date -u +%Y-%m-%d)"
            git push
          fi
